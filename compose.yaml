services:
  honeypot:
    image: fake-ubuntu-ssh-honeypot:3.0.1
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    user: "10001:10001"
    read_only: true
    stdin_open: false
    tty: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
    ports:
      - "${HONEYPOT_PUBLIC_BIND:-127.0.0.1}:${HONEYPOT_PUBLIC_PORT:-2222}:2222/tcp"
    environment:
      HONEYPOT_PRODUCTION: "true"
      HONEYPOT_HOST: "0.0.0.0"
      HONEYPOT_PORT: "2222"
      HONEYPOT_HOSTNAME: "${HONEYPOT_HOSTNAME:-server01}"
      # Empty is allowed while building the image. Production validation
      # rejects startup until a real key is placed in .env.
      HONEYPOT_HOST_KEY_B64: "${HONEYPOT_HOST_KEY_B64:-}"
      HONEYPOT_CREDENTIAL_LOG_MODE: "${HONEYPOT_CREDENTIAL_LOG_MODE:-sha256}"
      HONEYPOT_ALERT_MIN_RISK: "${HONEYPOT_ALERT_MIN_RISK:-65}"
      HONEYPOT_INTELLIGENCE_ENABLED: "${HONEYPOT_INTELLIGENCE_ENABLED:-true}"
      HONEYPOT_IOC_ENABLED: "${HONEYPOT_IOC_ENABLED:-true}"
      HONEYPOT_LOG_HASHING: "${HONEYPOT_LOG_HASHING:-true}"
      HONEYPOT_MAX_SESSION_HISTORY: "${HONEYPOT_MAX_SESSION_HISTORY:-500}"
      HONEYPOT_MAX_SCORE: "${HONEYPOT_MAX_SCORE:-1000}"
      HONEYPOT_MAX_CONNECTIONS: "${HONEYPOT_MAX_CONNECTIONS:-64}"
      HONEYPOT_MAX_CONNECTIONS_PER_IP: "${HONEYPOT_MAX_CONNECTIONS_PER_IP:-4}"
      HONEYPOT_LISTEN_BACKLOG: "${HONEYPOT_LISTEN_BACKLOG:-128}"
      HONEYPOT_BANNER_TIMEOUT: "${HONEYPOT_BANNER_TIMEOUT:-12}"
      HONEYPOT_AUTH_TIMEOUT: "${HONEYPOT_AUTH_TIMEOUT:-20}"
      HONEYPOT_CHANNEL_TIMEOUT: "${HONEYPOT_CHANNEL_TIMEOUT:-20}"
      HONEYPOT_REQUEST_TIMEOUT: "${HONEYPOT_REQUEST_TIMEOUT:-10}"
      HONEYPOT_CHANNEL_IO_TIMEOUT: "${HONEYPOT_CHANNEL_IO_TIMEOUT:-30}"
      HONEYPOT_GLOBAL_RATE_PER_MINUTE: "${HONEYPOT_GLOBAL_RATE_PER_MINUTE:-120}"
      HONEYPOT_GLOBAL_RATE_BURST: "${HONEYPOT_GLOBAL_RATE_BURST:-30}"
      HONEYPOT_IP_RATE_PER_MINUTE: "${HONEYPOT_IP_RATE_PER_MINUTE:-12}"
      HONEYPOT_IP_RATE_BURST: "${HONEYPOT_IP_RATE_BURST:-4}"
      HONEYPOT_IDLE_TIMEOUT: "${HONEYPOT_IDLE_TIMEOUT:-90}"
      HONEYPOT_MAX_SESSION_SECONDS: "${HONEYPOT_MAX_SESSION_SECONDS:-900}"
      HONEYPOT_COMMAND_DELAY_MIN: "${HONEYPOT_COMMAND_DELAY_MIN:-0.1}"
      HONEYPOT_COMMAND_DELAY_MAX: "${HONEYPOT_COMMAND_DELAY_MAX:-1.0}"
      HONEYPOT_MAX_LINE_LENGTH: "${HONEYPOT_MAX_LINE_LENGTH:-4096}"
      HONEYPOT_MAX_COMMANDS: "${HONEYPOT_MAX_COMMANDS:-500}"
      HONEYPOT_MAX_CHAIN_COMMANDS: "${HONEYPOT_MAX_CHAIN_COMMANDS:-32}"
      HONEYPOT_HISTORY_LIMIT: "${HONEYPOT_HISTORY_LIMIT:-200}"
      HONEYPOT_MAX_OUTPUT_BYTES: "${HONEYPOT_MAX_OUTPUT_BYTES:-65536}"
      HONEYPOT_MAX_PACKAGES: "${HONEYPOT_MAX_PACKAGES:-256}"
      HONEYPOT_VFS_MAX_NODES: "${HONEYPOT_VFS_MAX_NODES:-2048}"
      HONEYPOT_VFS_MAX_TOTAL_BYTES: "${HONEYPOT_VFS_MAX_TOTAL_BYTES:-2097152}"
      HONEYPOT_VFS_MAX_FILE_BYTES: "${HONEYPOT_VFS_MAX_FILE_BYTES:-131072}"
      HONEYPOT_VFS_MAX_PATH_LENGTH: "${HONEYPOT_VFS_MAX_PATH_LENGTH:-512}"
      HONEYPOT_VFS_MAX_NAME_LENGTH: "${HONEYPOT_VFS_MAX_NAME_LENGTH:-255}"
      HONEYPOT_VFS_MAX_QUERY_RESULTS: "${HONEYPOT_VFS_MAX_QUERY_RESULTS:-512}"
      HONEYPOT_LOG_QUEUE_SIZE: "${HONEYPOT_LOG_QUEUE_SIZE:-10000}"
      HONEYPOT_LOG_FIELD_LIMIT: "${HONEYPOT_LOG_FIELD_LIMIT:-4096}"
    mem_limit: "${HONEYPOT_MEMORY_LIMIT:-384m}"
    mem_reservation: "${HONEYPOT_MEMORY_RESERVATION:-128m}"
    cpus: "${HONEYPOT_CPU_LIMIT:-0.75}"
    pids_limit: 128
    ulimits:
      nofile:
        soft: 2048
        hard: 4096
      nproc:
        soft: 128
        hard: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    networks:
      - honeynet

networks:
  honeynet:
    name: fake-ssh-honeynet
    internal: false
    driver: bridge
